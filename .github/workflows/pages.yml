# Publishes the read-only copy of the site to GitHub Pages.
# Content comes from content/site.json — export it from the live site at
# https://swipmi.com/api/export, paste it in, commit and push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/site.json'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/build-static.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        # Served from https://<user>.github.io/<repo>/
        run: PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build:static
      - name: Stop Pages running Jekyll over the output
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
