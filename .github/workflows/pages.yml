name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir out
          cat > out/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Moved</title></head>
          <body>
          <p>This portfolio has moved to <a href="https://swipmi.com">https://swipmi.com</a></p>
          </body>
          </html>
          EOF
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
